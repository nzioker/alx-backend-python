apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-messaging-app-blue
  namespace: messaging-app
  labels:
    app: django-messaging
    version: blue
    tier: backend
spec:
  replicas: 3  # Increased for rolling update demonstration
  selector:
    matchLabels:
      app: django-messaging
      version: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: django-messaging
        version: blue
        tier: backend
    spec:
      containers:
      - name: django-app
        image:
